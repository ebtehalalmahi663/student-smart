name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # الخطوة السحرية: إنشاء هيكل مشروع أندرويد كاملاً في السيرفر تلقائياً
      - name: Generate Android Native Project Structure
        run: |
          mkdir temp_app
          flutter create --org com.example --project-name smart_academic_assistant temp_app
          cp -r temp_app/android ./android
          rm -rf temp_app

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAssistantApp-release
          path: build/app/outputs/flutter-apk/app-release.apk
