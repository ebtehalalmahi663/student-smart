name: smart_academic_assistant
description: "تطبيق المساعد الذكي لمراجعة المقرر الدراسي لطلاب الجامعات"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  file_picker: ^8.0.0
  open_filex: ^4.5.0
syncfusion_flutter_pdf: ^24.2.7 # لقراءة نصوص الـ PDF الحقيقية
  http: ^1.2.0 # للتواصل مع Gemini API
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
